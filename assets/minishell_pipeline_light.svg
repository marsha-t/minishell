<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1240" viewBox="0 0 920 1240" role="img" aria-labelledby="title desc">
  <title id="title">Minishell processing pipeline</title>
  <desc id="desc">A vertical flowchart from readline input through parsing, expansion, setup, execution, and cleanup.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 2; }
      .label {
        fill: #24292f;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 24px;
        font-weight: 600;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .stage {
        fill: #57606a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 2px;
        text-anchor: start;
      }
      .arrow {
        stroke: #8c959f;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
      }
      .divider {
        stroke: #d8dee4;
        stroke-width: 1.5;
      }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect class="bg" width="920" height="1240" rx="24"/>

  <!-- Stage labels -->
  <text class="stage" x="115" y="68">INPUT</text>
  <line class="divider" x1="115" y1="80" x2="805" y2="80"/>

  <text class="stage" x="115" y="218">PARSING</text>
  <line class="divider" x1="115" y1="230" x2="805" y2="230"/>

  <text class="stage" x="115" y="598">PREPARATION</text>
  <line class="divider" x1="115" y1="610" x2="805" y2="610"/>

  <text class="stage" x="115" y="848">EXECUTION</text>
  <line class="divider" x1="115" y1="860" x2="805" y2="860"/>

  <text class="stage" x="115" y="1098">FINALIZATION</text>
  <line class="divider" x1="115" y1="1110" x2="805" y2="1110"/>

  <!-- Boxes -->
  <rect class="box" x="170" y="100" width="580" height="82" rx="14"/>
  <text class="label" x="460" y="141">Readline input</text>

  <rect class="box" x="170" y="240" width="580" height="82" rx="14"/>
  <text class="label" x="460" y="281">Syntax validation</text>

  <rect class="box" x="170" y="360" width="580" height="82" rx="14"/>
  <text class="label" x="460" y="401">Tokenization</text>

  <rect class="box" x="170" y="480" width="580" height="82" rx="14"/>
  <text class="label" x="460" y="521">Intermediate node list</text>

  <rect class="box" x="170" y="620" width="580" height="82" rx="14"/>
  <text class="label" x="460" y="661">Hybrid execution tree construction</text>

  <rect class="box" x="170" y="740" width="580" height="82" rx="14"/>
  <text class="label" x="460" y="781">Variable, wildcard, and quote expansion</text>

  <rect class="box" x="170" y="870" width="580" height="82" rx="14"/>
  <text class="label" x="460" y="911">Redirection and pipe setup</text>

  <rect class="box" x="170" y="990" width="580" height="82" rx="14"/>
  <text class="label" x="460" y="1031">Built-in or external command execution</text>

  <rect class="box" x="170" y="1120" width="580" height="82" rx="14"/>
  <text class="label" x="460" y="1161">Exit-status update and cleanup</text>

  <!-- Arrows -->
  <path class="arrow" d="M460 182 V232" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M460 322 V352" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M460 442 V472" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M460 562 V612" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M460 702 V732" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M460 822 V862" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M460 952 V982" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M460 1072 V1112" marker-end="url(#arrowhead)"/>
</svg>
